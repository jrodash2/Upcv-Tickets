<div class="col-lg-6"><div class="card"><div class="card-body">
  <form method="post" action="{% url 'gestion_empleados:requisito_revisar' d.pk %}">{% csrf_token %}
    <h6>{{ d.requisito.codigo }}. {{ d.requisito.descripcion }}</h6>
    <div class="form-check"><input class="form-check-input" type="checkbox" name="cumple" {% if d.cumple %}checked{% endif %} {% if bloqueado %}disabled{% endif %}><label>Cumple</label></div>
    <textarea class="form-control my-2" name="observacion" placeholder="Observación" {% if bloqueado %}disabled{% endif %}>{{ d.observacion }}</textarea>
    {% if not bloqueado %}<button class="btn btn-sm btn-primary">Guardar revisión</button>{% endif %}
    {% if d.revisado_por %}<small class="d-block mt-2">{{ d.revisado_por }} · {{ d.fecha_revision }}</small>{% endif %}
  </form>
</div></div></div>
