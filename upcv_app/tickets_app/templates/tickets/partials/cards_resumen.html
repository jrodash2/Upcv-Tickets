{% load static %}
{% for card in cards %}
<div class="col-xl-3 col-md-6 dashboard-card">
  <div class="card h-100 tickets-stat-card tickets-stat-card--{{ forloop.counter }}">
    <div class="card-body">
      <div class="tickets-stat-content">
        <div class="tickets-stat-icon flex-shrink-0">
          <svg aria-hidden="true"><use href="{% static 'assets/svg/icon-sprite.svg#' %}{{ card.icono }}"></use></svg>
        </div>
        <div class="tickets-stat-details">
          <span class="tickets-stat-title">{{ card.titulo }}</span>
          <strong class="tickets-stat-value">{{ card.valor }}</strong>
          <div class="tickets-stat-trend comparison-{{ card.comparacion.tipo }}">
            {% if card.comparacion.tipo == 'up' %}<i class="fa fa-arrow-up" aria-hidden="true"></i>
            {% elif card.comparacion.tipo == 'down' %}<i class="fa fa-arrow-down" aria-hidden="true"></i>
            {% else %}<i class="fa fa-minus" aria-hidden="true"></i>{% endif %}
            {{ card.comparacion.texto }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endfor %}
